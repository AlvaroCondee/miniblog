security:
    password_hashers:
        App\Security\User: 'auto'

    providers:
        app_users:
            id: App\Security\UserProvider

    role_hierarchy:
        ROLE_ADMIN: [ROLE_TEACHER]
        ROLE_TEACHER: [ROLE_USER]
        ROLE_STUDENT: [ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)
            security: false
        main:
            lazy: true
            provider: app_users
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: backend
            logout:
                path: logout
                target: homepage

    access_control:
        - { path: ^/admin/(users|categories), roles: ROLE_ADMIN }
        - { path: ^/admin, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Security\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
