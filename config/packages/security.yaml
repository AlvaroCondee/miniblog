security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'auto'

    providers:
        users_in_memory:
            memory:
                users:
                    # usuario: admin; contraseña: 1234
                    admin:
                        password: '$2y$10$y.DtTqnPnuMMKSEgC.NimO7dqAQfljFW0K9MRZUdn0VzugYxas3mS'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt)
            security: false
        main:
            lazy: true
            provider: users_in_memory
            http_basic:
                realm: Miniblog

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
